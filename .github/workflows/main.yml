name: Build and Push Backend & Postgres Images to ECR

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (validates AWS/ECR & builds images without pushing)"
        required: true
        default: true
        type: boolean
      image_tag:
        description: "Image tag to push (must match image_tag in infra/terraform.tfvars)"
        required: true
        default: "dev-v1"
        type: string
      target:
        description: "Which image(s) to build and push"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - postgres

  push:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - "postgres.Dockerfile"
      - ".github/workflows/ecr-push.yml"

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO_POSTGRES: venu-tech-postgres
  ECR_REPO_BACKEND: venu-tech-backend

jobs:
  build-and-push-ecr:
    name: Build & Push to Mumbai ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repositories exist
        shell: bash
        run: |
          aws ecr describe-repositories \
            --region "${{ env.AWS_REGION }}" \
            --repository-names "${{ env.ECR_REPO_POSTGRES }}" "${{ env.ECR_REPO_BACKEND }}" \
            --query "repositories[].repositoryUri" \
            --output table

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags and dry-run mode
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ inputs.dry_run }}"
          else
            DRY_RUN="false"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            PUSH_IMAGES="false"
          else
            PUSH_IMAGES="true"
          fi

          TAG="${{ inputs.image_tag || 'dev-v1' }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "push_images=${PUSH_IMAGES}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "target=${{ inputs.target || 'all' }}" >> "$GITHUB_OUTPUT"

      - name: Build (and push if not dry run) Postgres image
        if: steps.meta.outputs.target == 'all' || steps.meta.outputs.target == 'postgres'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: postgres.Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push_images }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_POSTGRES }}:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_POSTGRES }}:${{ steps.meta.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_POSTGRES }}:latest
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Build (and push if not dry run) Backend image
        if: steps.meta.outputs.target == 'all' || steps.meta.outputs.target == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push_images }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_BACKEND }}:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_BACKEND }}:${{ steps.meta.outputs.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Write ECR pipeline summary
        if: always()
        shell: bash
        run: |
          echo "### ECR Pipeline Summary (${{ env.AWS_REGION }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode:** \`$([ "${{ steps.meta.outputs.dry_run }}" = "true" ] && echo "DRY RUN (no push)" || echo "LIVE PUSH")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry:** \`${{ steps.login-ecr.outputs.registry }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ steps.meta.outputs.tag }}\` (Commit: \`${{ steps.meta.outputs.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target:** \`${{ steps.meta.outputs.target }}\`" >> "$GITHUB_STEP_SUMMARY"
